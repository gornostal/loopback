[package]
name = "loopback-desktop"
version = "0.1.0"
description = "Loopback desktop inbox: answer AI agents' questions and read their notifications"
authors = ["Oleksandr Gornostal"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see cargo#8519 on Windows).
name = "loopback_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["time"] }

# Linux: talk to the notification daemon directly so clicking a notification opens the request
# and answered/cancelled requests close theirs. Elsewhere the Tauri plugin shows plain notifications.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
